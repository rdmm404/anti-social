services:
  anti-social:
    container_name: svc-anti-social
    build:
      context: .
    user: "1000:1000"
    environment:
      TZ: "${TZ:-America/Toronto}"
      ANTI_SOCIAL_BLOCKED: "${ANTI_SOCIAL_BLOCKED:-}"
    volumes:
      - ./data:/data
    networks:
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.http.routers.anti-social.rule=Host(`yt.nautilus.voltr.org`)"
      - "traefik.http.routers.anti-social.entrypoints=websecure"
      - "traefik.http.routers.anti-social.tls.certresolver=myresolver"
      - "traefik.http.services.anti-social.loadbalancer.server.port=8484"
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8484/api/status', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

networks:
  traefik_proxy:
    external: true
