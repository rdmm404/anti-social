name: Phone release

# Push a tag like phone-v1.2.0 to build the app and attach it to a release.
on:
  push:
    tags: ["phone-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Installs the SDK and accepts its licenses, which Gradle needs to fetch the platform.
      - uses: android-actions/setup-android@v4

      # The TV's key: one keystore signs both apps.
      - name: Decode the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.TV_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Test and build
        working-directory: tv
        env:
          ANTI_SOCIAL_KEYSTORE: ${{ runner.temp }}/release.jks
          ANTI_SOCIAL_KEYSTORE_PASSWORD: ${{ secrets.TV_KEYSTORE_PASSWORD }}
        run: >
          ./gradlew :core:jvmTest :youtube:test testDebugUnitTest :phone:assembleRelease
          -PversionCode=${{ github.run_number }}
          -PversionName=${GITHUB_REF_NAME#phone-v}

      # A fixed file name keeps the .../releases/latest/download/anti-social-phone.apk link stable.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp tv/phone/build/outputs/apk/release/phone-release.apk anti-social-phone.apk
          gh release create "$GITHUB_REF_NAME" anti-social-phone.apk \
            --title "Phone app ${GITHUB_REF_NAME#phone-v}" --generate-notes
